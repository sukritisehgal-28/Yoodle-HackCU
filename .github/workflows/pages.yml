name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build static export
        run: |
          # Swap in the static-export Next.js config
          cp next.config.pages.ts next.config.ts

          # Remove server-only code that blocks static export
          rm -rf src/app/api src/app/\(app\) src/app/\(auth\)
          rm -f src/middleware.ts src/instrumentation.ts
          rm -f sentry.server.config.ts sentry.edge.config.ts instrumentation-client.ts

          NODE_OPTIONS="--max-old-space-size=4096" npx next build
        env:
          NEXT_PUBLIC_APP_URL: https://sukritisehgal-28.github.io/Yoodle-HackCU
          NEXT_PUBLIC_BASE_PATH: /Yoodle-HackCU

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
